<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Resend Verification - Tracker App</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
    <script src="/js/theme-toggle.js"></script>
</head>
<body>
<div class="auth-container glass">
    <button type="button" class="theme-toggle theme-toggle-corner"><i class="bi bi-moon-stars"></i> Dark Mode</button>
    <h1>Resend Verification Email</h1>
    <form th:action="@{/resend-verification}" method="post">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required />
        <button type="submit">Send</button>
    </form>
    <p style="margin-top:20px;"><a th:href="@{/login}">Back to Login</a></p>
</div>
</body>
</html>
