# Application name
spring.application.name=tracker-app

# ==================== DataSource Configuration ====================
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================== JPA / Hibernate Configuration ====================
# ddl-auto is now 'validate', not 'update' ? Hibernate checks the schema
# matches the entities but no longer creates/alters tables itself. Flyway
# now owns all schema changes, applied via versioned files in
# src/main/resources/db/migration/.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==================== Server Configuration ====================
server.port=8080

# ==================== Email (SMTP) Configuration ====================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=shivaniavanikkarasi@gmail.com
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Base URL used to build verification/reset links in emails ? change this
# when we deploy to AWS in a later step (Step 27), since localhost links
# won't work for anyone but you testing locally.
app.base-url=http://localhost:8080

# ==================== Error Handling ====================
# Never leak stack traces or exception details to the browser ? this
# template (templates/error/error.html) is shown instead for any
# uncaught exception that doesn't already have a dedicated status page
# (like 404.html/403.html).
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never



# ==================== Flyway Configuration ====================
spring.flyway.enabled=true
# baseline-on-migrate=true tells Flyway: if the target schema already has
# tables but no Flyway history table yet, mark the current state as
# version 1 (baseline) rather than trying to create tables that already
# exist. This is exactly our situation ? critical for this one-time cutover.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1