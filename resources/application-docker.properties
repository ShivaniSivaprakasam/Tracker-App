Docker properties:
# ==================== Docker Profile Overrides ====================
# Activated via --spring.profiles.active=docker (set in the Dockerfile's
# ENTRYPOINT). Only overrides what changes inside a container ? the
# database host becomes the Docker Compose service name "mysql" instead
# of "localhost", since containers reach each other by service name over
# Docker's internal network, not by localhost.

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

app.base-url=${APP_BASE_URL:http://localhost:8080}

