<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Tracker App</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
    <script src="/js/theme-toggle.js"></script>
    <script src="/js/password-toggle.js" defer></script>
</head>
<body>
<div class="auth-container glass">
    <button type="button" class="theme-toggle theme-toggle-corner"><i class="bi bi-moon-stars"></i> Dark Mode</button>
    <h1>Welcome Back</h1>

    <p th:if="${errorMessage}" th:text="${errorMessage}" class="msg-error"></p>
    <p th:if="${successMessage}" th:text="${successMessage}" class="msg-success"></p>

    <form th:action="@{/login}" method="post">
        <label for="username">Email</label>
        <input type="text" id="username" name="username" required />

        <label for="password">Password</label>
        <div class="password-field-wrapper">
            <input type="password" id="password" name="password" required />
        </div>

        <button type="submit">Login</button>
    </form>

    <p style="margin-top:20px;">
        <a th:href="@{/resend-verification}">Resend verification email</a><br/>
        <a th:href="@{/forgot-password}">Forgot your password?</a>
    </p>
    <p>Don't have an account? <a th:href="@{/register}">Register here</a></p>
</div>
</body>
</html>
