<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Reset Password - Tracker App</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
    <script src="/js/theme-toggle.js"></script>
    <script src="/js/password-toggle.js" defer></script>
</head>
<body>
<div class="auth-container glass">
    <button type="button" class="theme-toggle theme-toggle-corner"><i class="bi bi-moon-stars"></i> Dark Mode</button>
    <h1>Choose a New Password</h1>
    <p th:if="${errorMessage}" th:text="${errorMessage}" class="msg-error"></p>

    <form th:action="@{/reset-password}" method="post">
        <input type="hidden" name="token" th:value="${token}" />
        <label for="newPassword">New Password</label>
        <div class="password-field-wrapper">
            <input type="password" id="newPassword" name="newPassword" required />
        </div>
        <label for="confirmNewPassword">Confirm New Password</label>
        <div class="password-field-wrapper">
            <input type="password" id="confirmNewPassword" name="confirmNewPassword" required />
        </div>
        <button type="submit">Reset Password</button>
    </form>
</div>
</body>
</html>
